# ─────────────────────────────────────────────────────────────
# 宿主机网关：research.elecnest.cn → discover 测试环境（HTTP，SSE 长连接）
# 放置位置：nginx-public 容器 /etc/nginx/conf.d/research.elecnest.cn.conf
# 放入并生效：
#   docker cp deploy/nginx/gateway-research.conf nginx-public:/etc/nginx/conf.d/research.elecnest.cn.conf
#   docker exec nginx-public nginx -t && docker exec nginx-public nginx -s reload
# 说明：
#   · discover 前端容器映射宿主 9003（未 join nginx-public 网络），反代走 172.17.0.1:9003（同 crm 配置写法）；
#   · /api 为 SSE 长连接，必须 proxy_buffering off + 长读写超时，否则流式输出被缓冲、逐帧推送失效；
#   · .well-known/acme-challenge 为 Let's Encrypt 预留；HTTPS 就绪后再加 443 server 块。
# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name research.elecnest.cn;

    # Let's Encrypt 证书校验预留
    location /.well-known/acme-challenge/ { root /var/nginx/html; }

    client_max_body_size 0;

    location / {
        # 172.17.0.1 = docker 默认 bridge 的宿主地址；本配置运行在 nginx-public 容器内，
        # 容器内 127.0.0.1 指向自身，访问宿主机 9003（前端容器映射端口）必须走 172.17.0.1。
        proxy_pass http://172.17.0.1:9003;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;              # SSE：关缓冲，逐帧透传
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;         # SSE 长连接
        proxy_send_timeout 3600s;
    }
}
