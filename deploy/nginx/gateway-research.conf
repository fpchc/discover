# ===== 宿主机网关：research.elecnest.cn → discover 测试环境（HTTP，暂不配 HTTPS）=====
# 部署物统一管理（根目录 deploy/）。
# 放置位置：宿主机 nginx:latest 容器的 /etc/nginx/conf.d/（80/443 已被该容器占用）。
# 作用：把 research.elecnest.cn:80 反代到测试前端（127.0.0.1:8081）。
# 数据流：浏览器 → 本网关(80) → 前端容器 nginx(8081) → 后端(8000)。
#          /api 的 SSE 由前端 nginx 关缓冲透传；本网关同样必须 proxy_buffering off + 长超时。
# 后续要上 HTTPS：补 443 server 块 + 证书即可，80 跳转到 443。

server {
    listen 80;
    server_name research.elecnest.cn;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # SSE：关缓冲，逐帧透传
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;     # SSE 长连接
        proxy_send_timeout 3600s;
    }
}
