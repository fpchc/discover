name: discover-test

services:
  postgres:
    image: postgres:16
    container_name: discover-test-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_platform
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # 公共环境变量（LLM / SSE / 工具等）来自 docker-compose.base.yml 的 backend-base；
    # 此处仅补充按环境区分的 DB_* 连接。
    extends:
      file: docker-compose.base.yml
      service: backend-base
    build:
      context: ./discover_backend
      dockerfile: Dockerfile
    image: discover-backend:test
    restart: unless-stopped
    environment:
      <<: *common-env
    volumes:  
      - backend-storage:/app/storage
      - backend-logs:/app/logs
      - backend-workspaces:/app/workspaces
    expose:
      - "8000"

  frontend:
    build:
      context: ./discover_frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        VITE_APP_ENV: test
        VITE_API_BASE_URL: /api/v1
    image: discover-frontend:test
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"
    environment:
      - BACKEND_PROXY_PASS=http://backend:8000

volumes:
  pgdata:
  backend-storage:
  backend-logs:
  backend-workspaces:
