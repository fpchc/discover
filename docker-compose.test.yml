x-common-env: &common-env
  # ---------- 路径 ----------
  AGENTS_ROOT_DIR: ${AGENTS_ROOT_DIR:-agents}
  MCP_REGISTRY_PATH: ${MCP_REGISTRY_PATH:-config/mcp-servers.yaml}
  LLM_PROVIDERS_PATH: ${LLM_PROVIDERS_PATH:-config/llm-providers.yaml}
  AGENT_WORKSPACE_ROOT_DIR: ${AGENT_WORKSPACE_ROOT_DIR:-workspaces}

  # ---------- 数据库 ----------
  DB_USERNAME: ${DB_USERNAME:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-v7Hf}
  DB_HOST: ${DB_HOST:-175.178.45.21}
  DB_PORT: ${DB_PORT:-5432}
  DB_DATABASE: ${DB_DATABASE:-agent_platform}

  # ---------- 存储 ----------
  STORAGE_ROOT_DIR: ${STORAGE_ROOT_DIR:-storage}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}

  # ---------- LLM ----------
  DEFAULT_PROVIDER_ID: ${DEFAULT_PROVIDER_ID:-qwen3.7-max}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_CONNECT_TIMEOUT_SECONDS: ${LLM_CONNECT_TIMEOUT_SECONDS:-10}
  LLM_READ_TIMEOUT_SECONDS: ${LLM_READ_TIMEOUT_SECONDS:-60}
  LLM_TOTAL_TIMEOUT_SECONDS: ${LLM_TOTAL_TIMEOUT_SECONDS:-300}
  ERROR_MESSAGE_MAX_CHARS: ${ERROR_MESSAGE_MAX_CHARS:-500}

  # ---------- 思考模式 ----------
  THINKING_ENABLED: ${THINKING_ENABLED:-true}

  # ---------- SSE ----------
  TYPEWRITER_FRAME_INTERVAL_MS: ${TYPEWRITER_FRAME_INTERVAL_MS:-30}
  TYPEWRITER_CHARS_PER_FRAME: ${TYPEWRITER_CHARS_PER_FRAME:-2}
  TYPEWRITER_CATCHUP_THRESHOLD: ${TYPEWRITER_CATCHUP_THRESHOLD:-200}
  TYPEWRITER_CATCHUP_RATIO: ${TYPEWRITER_CATCHUP_RATIO:-4}

  THINKING_FRAME_INTERVAL_MS: ${THINKING_FRAME_INTERVAL_MS:-20}
  THINKING_CHARS_PER_FRAME: ${THINKING_CHARS_PER_FRAME:-4}

  SSE_HEARTBEAT_INTERVAL_SECONDS: ${SSE_HEARTBEAT_INTERVAL_SECONDS:-15}
  SSE_QUEUE_MAX_EVENTS: ${SSE_QUEUE_MAX_EVENTS:-128}

  # ---------- 控制台 ----------
  CONSOLE_BASE_URL: ${CONSOLE_BASE_URL:-http://127.0.0.1:8000}
  CONSOLE_CHAR_DELAY_MS: ${CONSOLE_CHAR_DELAY_MS:-20}
  CONSOLE_REQUEST_TIMEOUT_SECONDS: ${CONSOLE_REQUEST_TIMEOUT_SECONDS:-300}

  # ---------- 工具 ----------
  TOOL_BATCH_CONCURRENCY: ${TOOL_BATCH_CONCURRENCY:-10}
  TOOL_DEFAULT_TIMEOUT_SECONDS: ${TOOL_DEFAULT_TIMEOUT_SECONDS:-30}
  TOOL_OUTPUT_TRUNCATE_CHARS: ${TOOL_OUTPUT_TRUNCATE_CHARS:-6000}
  TOOL_LOG_ROOT_DIR: ${TOOL_LOG_ROOT_DIR:-logs/tools}
  TOOL_LOG_RETENTION_DAYS: ${TOOL_LOG_RETENTION_DAYS:-7}
  TOOL_LOG_MAX_FILES_PER_SESSION: ${TOOL_LOG_MAX_FILES_PER_SESSION:-200}

  # ---------- MCP ----------
  ALIBABA_SEARCH_TOKEN: ${ALIBABA_SEARCH_TOKEN:-}
  YUANBAO_SEARCH_TOKEN: ${YUANBAO_SEARCH_TOKEN:-}

  # ---------- 会话 ----------
  ARTIFACT_MAX_SIZE_BYTES: ${ARTIFACT_MAX_SIZE_BYTES:-104857600}

  # ---------- 推理 ----------
  CONTEXT_BUDGET_TOKENS: ${CONTEXT_BUDGET_TOKENS:-96000}
  REASONING_MAX_TURNS: ${REASONING_MAX_TURNS:-40}
  HISTORY_MAX_MESSAGES: ${HISTORY_MAX_MESSAGES:-50}
  ROUTING_CONFIDENCE_THRESHOLD: ${ROUTING_CONFIDENCE_THRESHOLD:-0.6}

  # ---------- Agent装配 ----------
  AGENT_BODY_MAX_CHARS: ${AGENT_BODY_MAX_CHARS:-2000}
  SKILL_BODY_MAX_CHARS: ${SKILL_BODY_MAX_CHARS:-8000}

  # ---------- 功能开关 ----------
  HOT_RELOAD_ENABLED: ${HOT_RELOAD_ENABLED:-false}
  HOT_RELOAD_INTERVAL_SECONDS: ${HOT_RELOAD_INTERVAL_SECONDS:-30}

  # ---------- 插件 ----------
  LOGGING_ENABLED: ${LOGGING_ENABLED:-true}
  DB_ENABLED: ${DB_ENABLED:-true}
  STORAGE_ENABLED: ${STORAGE_ENABLED:-true}
  MCP_ENABLED: ${MCP_ENABLED:-true}
  LLM_ENABLED: ${LLM_ENABLED:-true}
  REDIS_ENABLED: ${REDIS_ENABLED:-false}

  # ---------- Logging ----------
  LOG_OUTPUT_FORMAT: ${LOG_OUTPUT_FORMAT:-text}
  LOG_TZ: ${LOG_TZ:-Asia/Shanghai}
  LOG_DIR: ${LOG_DIR:-logs}
  LOG_FILE: ${LOG_FILE:-app.log}
  LOG_FILE_MAX_SIZE: ${LOG_FILE_MAX_SIZE:-10}
  LOG_FILE_BACKUP_COUNT: ${LOG_FILE_BACKUP_COUNT:-5}
  LOG_LEVEL: ${LOG_LEVEL:-info}

  # ---------- Redis ----------
  REDIS_URL: ${REDIS_URL:-redis://127.0.0.1:6379/0}
  REDIS_CACHE_DEFAULT_TTL_SECONDS: ${REDIS_CACHE_DEFAULT_TTL_SECONDS:-3600}
  REDIS_LOCK_DEFAULT_TIMEOUT_SECONDS: ${REDIS_LOCK_DEFAULT_TIMEOUT_SECONDS:-30}

  # ---------- 中间件 ----------
  REQUEST_LOGGING_ENABLED: ${REQUEST_LOGGING_ENABLED:-true}

  # ---------- 服务 ----------
  HOST: ${HOST:-0.0.0.0}
  PORT: ${PORT:-8000}

  # ---------- 账号认证（JWT + Argon2id） ----------
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES:-10080}
  ARGON2_TIME_COST: ${ARGON2_TIME_COST:-3}
  ARGON2_MEMORY_COST: ${ARGON2_MEMORY_COST:-65536}
  ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-4}

  # ---------- 账号资料（头像 / 密码） ----------
  ACCOUNT_PASSWORD_MIN_LENGTH: ${ACCOUNT_PASSWORD_MIN_LENGTH:-8}
  AVATAR_MAX_SIZE_BYTES: ${AVATAR_MAX_SIZE_BYTES:-2097152}
  AVATAR_ALLOWED_EXTENSIONS: ${AVATAR_ALLOWED_EXTENSIONS:-png,jpg,jpeg,webp,gif}
  AVATAR_MAX_DIMENSION: ${AVATAR_MAX_DIMENSION:-512}
  AVATAR_MIN_DIMENSION: ${AVATAR_MIN_DIMENSION:-32}

  # ---------- 公司统一登录（elecnest SSO） ----------
  ELECNEST_SSO_ENABLED: ${ELECNEST_SSO_ENABLED:-false}
  ELECNEST_GET_USER_INFO_URL: ${ELECNEST_GET_USER_INFO_URL:-https://id.elecnest.cn/api/login/getUserInfo}
  ELECNEST_SSO_TIMEOUT_SECONDS: ${ELECNEST_SSO_TIMEOUT_SECONDS:-10}

name: discover-test

services:

  discover_backend:
    build:
      context: ./discover_backend
      dockerfile: Dockerfile
    image: discover-backend:test
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      <<: *common-env
    volumes:  
      - ./storage:/app/storage
      - ./logs:/app/logs
      - ./workspaces:/app/workspaces
    networks:
      - discover-net

  discover_frontend:
    build:
      context: ./discover_frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        VITE_APP_ENV: test
        VITE_API_BASE_URL: /api/v1
    image: discover-frontend:test
    restart: unless-stopped
    depends_on:
      - discover_backend
    ports:
      # 宿主机 80/443 已被 nginx:latest 网关占用，前端保持 9003，域名经网关反代接入
      - "9003:80"
    networks:
      - discover-net
    environment:
      - BACKEND_PROXY_PASS=http://discover_backend:8000
      # server_name：research.elecnest.cn（网关反代进入后 Host 透传匹配）
      - SERVER_NAME=research.elecnest.cn

networks:
  discover-net:
    driver: bridge
