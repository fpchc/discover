# MCP 服务注册表样例（复制为 config/mcp-servers.yaml 后使用）
# 字段定义见 .claude/commands/mcp-integration-spec.md §3
# 认证令牌只存环境变量名，值从环境读取；代码中不出现端点 URL 字面量。

servers:
  - id: alibaba_search
    transport: streamable_http
    base_url: "https://dashscope.aliyuncs.com/api/v1/mcps/WebSearch/mcp"
    auth:
      type: bearer_token
      token_env: "ALIBABA_SEARCH_TOKEN"
    per_session: false
    handshake_timeout_seconds: 30
    call_timeout_seconds: 30
    concurrency_limit: 3
  - id: yuanbao_search
    transport: streamable_http
    base_url: "https://api.wsa.cloud.tencent.com/Mcp"
    auth:
      type: bearer_token
      token_env: "YUANBAO_SEARCH_TOKEN"
    per_session: false
    handshake_timeout_seconds: 30
    call_timeout_seconds: 30
    concurrency_limit: 3

# 能力 = 技能与具体服务之间的抽象层（agent-package-spec §4）。
# 技能只声明「需要 web_search 能力」，提供方由本注册表决定；
# 加 / 删 / 换搜索提供方只改这里，不触碰智能体包内任何文件。
# strategy: failover = 主备切换，按 servers 顺序优先，第一个可用者生效，失败自动切换。
capabilities:
  web_search:
    strategy: failover
    servers:
      # - alibaba_search
      - yuanbao_search
