# P1 本地开发依赖：PostgreSQL。
# 启动：docker compose up -d；停止并清卷：docker compose down -v。
services:
  postgres:
    image: postgres:16
    container_name: agent-platform-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
