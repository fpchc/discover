# nginx 模板：启动时由官方镜像 envsubst 将 ${BACKEND_PROXY_PASS} 替换为后端地址
# ${SERVER_NAME} 由部署侧 compose 注入，prod/test 都必须设置（test=research.elecnest.cn；prod=_ 兜底）
server {
    listen 80;
    server_name ${SERVER_NAME};

    root /usr/share/nginx/html;
    index index.html;

    # 文件上传：后端 artifact_max_size_bytes 默认 100MB（POST /api/v1/files/upload）。
    # nginx 不设请求体上限（0 = 不限），真实限制由后端 enforce，避免 nginx 与后端上限不同步导致 413。
    client_max_body_size 0;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 安全响应头（snippet；location 内见下）
    include /etc/nginx/security-headers.conf;

    # Vite 客户端产物带内容 hash → 长缓存（SPA 静态输出为 assets/）
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
    }

    # index.html 不缓存，保证发版即时生效
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理：SSE 需关闭缓冲 + 长读写超时
    location /api/ {
        proxy_pass ${BACKEND_PROXY_PASS}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;   # 大文件上传流式转发，避免整包缓冲到磁盘
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
