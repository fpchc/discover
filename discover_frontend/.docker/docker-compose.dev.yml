# dev 环境：热更新 vite 服务，/api 代理到 host 后端（免 CORS）
# 构建上下文为项目根（context: ..）
services:
  frontend-dev:
    build:
      context: ..
      dockerfile: .docker/Dockerfile
      target: dev
    ports:
      - '5173:5173'
    volumes:
      - ..:/app
      - /app/node_modules
    environment:
      # Windows/macOS Docker Desktop：host.docker.internal 指宿主机
      - VITE_PROXY_TARGET=http://host.docker.internal:8000
    stdin_open: true
    tty: true
