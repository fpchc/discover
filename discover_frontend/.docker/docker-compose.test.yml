# test 环境：构建 test 模式产物 → nginx 服务，反代到 test 后端
# 构建上下文为项目根（context: ..）
services:
  frontend-test:
    build:
      context: ..
      dockerfile: .docker/Dockerfile
      target: runtime
      args:
        VITE_APP_ENV: test
        VITE_API_BASE_URL: /api/v1
    image: discover-frontend:test
    ports:
      - '8081:80'
    environment:
      - BACKEND_PROXY_PASS=${BACKEND_PROXY_PASS:-http://host.docker.internal:8000}
    restart: unless-stopped
