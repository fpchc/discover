# 安全响应头（snippet）
# 因 nginx add_header 继承规则：location 内只要有 add_header 即不继承 server 级，
# 故在带 Cache-Control 的 location 内也 include 本文件。
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
# script-src 允许 'unsafe-inline'：Nuxt SPA（ssr: false）生成静态 HTML 时内联 bootstrap
# 脚本初始化 window.__NUXT__，入口 chunk 依赖它挂载 Vue；静态 nginx 无法做 nonce/哈希（内容按构建变），
# 只能放行内联（XSS 缓解仍由 DOMPurify + 其余指令承担）。
