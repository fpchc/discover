name: discover

services:
  backend:
    build:
      context: ./discover_backend
      dockerfile: Dockerfile
      target: dev
    container_name: discover-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
    volumes:
      # 源码热挂载 + .venv 匿名卷（不污染宿主机）
      - ./discover_backend:/app
      - /app/.venv
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./discover_frontend
      dockerfile: Dockerfile
      target: dev
    container_name: discover-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      # 源码热挂载 + node_modules 匿名卷
      - ./discover_frontend:/app
      - /app/node_modules
    environment:
      # dev 代理：/api 反代到 compose 内 backend 服务（免 CORS）
      - VITE_PROXY_TARGET=http://backend:8000
    stdin_open: true
    tty: true

volumes:
  pgdata:
