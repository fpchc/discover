name: discover-test

services:

  discover_backend:
    build:
      context: ./discover_backend
      dockerfile: Dockerfile
    image: discover-backend:test
    restart: unless-stopped
    container_name: discover_backend
    depends_on:
      - tencent_mcp
      - eastmoney_mcp
    ports:
      - "9101:9101"
    environment:
      <<: *common-env
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
      - ./workspaces:/app/workspaces
    networks:
      - discover-net

  discover_frontend:
    build:
      context: ./discover_frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        VITE_APP_ENV: test
        VITE_API_BASE_URL: /api/v1
    image: discover-frontend:test
    container_name: discover_frontend
    restart: unless-stopped
    depends_on:
      - discover_backend
    ports:
      # 宿主机 80/443 已被 nginx:latest 网关占用，前端保持 9003，域名经网关反代接入
      - "9102:80"
    networks:
      - discover-net
    environment:
      - BACKEND_PROXY_PASS=http://discover_backend:9101
      # server_name：research.elecnest.cn（网关反代进入后 Host 透传匹配）
      - SERVER_NAME=research.elecnest.cn

  tencent_mcp:
    build:
      context: ./discover_backend
      dockerfile: Dockerfile
    image: discover-backend:test
    container_name: tencent_mcp
    restart: unless-stopped
    command: ["uv", "run", "--no-dev", "python", "-m", "local_mcp.tencent_mcp.main"]
    ports:
      - "9111:9111"
    environment:
      TENCENT_MCP_TOKEN: ${TENCENT_MCP_TOKEN:-}
      WSA_API_KEY: ${WSA_API_KEY:-}
      # 容器内须绑 0.0.0.0，否则同网络其他容器无法访问
      TENCENT_MCP_HOST: "0.0.0.0"
      TENCENT_MCP_PORT: "9111"
    networks:
      - discover-net

  eastmoney_mcp:
    build:
      context: ./discover_backend
      dockerfile: Dockerfile
    image: discover-backend:test
    container_name: eastmoney_mcp
    restart: unless-stopped
    command: ["uv", "run", "--no-dev", "python", "-m", "local_mcp.eastmoney_mcp.main"]
    ports:
      - "9112:9112"
    environment:
      EASTMONEY_MCP_TOKEN: ${EASTMONEY_MCP_TOKEN:-}
      # 容器内须绑 0.0.0.0，否则同网络其他容器无法访问
      EASTMONEY_MCP_HOST: "0.0.0.0"
      EASTMONEY_MCP_PORT: "9112"
    networks:
      - discover-net

networks:
  discover-net:
    driver: bridge
